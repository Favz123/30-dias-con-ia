<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asistente del Consultorio San Román</title>
<style>
  :root { --verde: #128c7e; --verde-claro: #dcf8c6; --fondo: #ece5dd; --texto: #1f2c34; --gris: #667781; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #d1d7db; color: var(--texto); }
  .app { max-width: 480px; height: 100dvh; margin: 0 auto; display: flex; flex-direction: column; background: var(--fondo); }
  header { background: var(--verde); color: #fff; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: #fff; color: var(--verde); display: grid; place-items: center; font-size: 22px; }
  header b { display: block; }
  header small { opacity: .85; }
  .aviso { background: #fff3c4; font-size: 12px; text-align: center; padding: 6px 10px; }
  #chat { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 82%; padding: 7px 10px; border-radius: 8px; line-height: 1.35; white-space: pre-wrap; box-shadow: 0 1px .5px rgba(0,0,0,.13); font-size: 15px; }
  .bot { background: #fff; align-self: flex-start; border-top-left-radius: 0; }
  .yo { background: var(--verde-claro); align-self: flex-end; border-top-right-radius: 0; }
  .error { background: #fde2e1; align-self: center; font-size: 13px; }
  .escribiendo { color: var(--gris); font-style: italic; }
  .atajos { display: flex; gap: 6px; padding: 0 12px 8px; flex-wrap: wrap; }
  .atajos button { border: 1px solid var(--verde); color: var(--verde); background: #fff; border-radius: 16px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  form { display: flex; gap: 8px; padding: 8px; background: #f0f2f5; }
  input { flex: 1; border: 0; border-radius: 20px; padding: 10px 14px; font-size: 16px; }
  form button { width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--verde); color: #fff; font-size: 18px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">⚕️</div>
    <div><b>Consultorio Médico San Román</b><small>Asistente automático · en línea</small></div>
  </header>
  <div class="aviso">Demostración con un consultorio ficticio. No escribas datos personales reales.</div>
  <div id="chat"></div>
  <div class="atajos" id="atajos">
    <button>¿Cuál es su horario?</button>
    <button>¿Cuánto cuesta la consulta?</button>
    <button>Quiero agendar una cita</button>
    <button>¿Dónde están?</button>
  </div>
  <form id="form">
    <input id="texto" maxlength="500" autocomplete="off" placeholder="Escribe un mensaje">
    <button id="enviar" aria-label="Enviar">➤</button>
  </form>
</div>
<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const texto = document.getElementById('texto');
const enviar = document.getElementById('enviar');
const historial = [];

function burbuja(clase, contenido) {
  const div = document.createElement('div');
  div.className = 'msg ' + clase;
  div.textContent = contenido;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

burbuja('bot', '¡Hola! 👋 Soy el asistente automático del Consultorio Médico San Román. Puedo darte horarios, precios y ayudarte a pedir una cita. ¿En qué te ayudo?');

async function mandar(mensaje) {
  mensaje = mensaje.trim();
  if (!mensaje || enviar.disabled) return;
  burbuja('yo', mensaje);
  historial.push({ role: 'user', content: mensaje });
  texto.value = '';
  enviar.disabled = true;
  const espera = burbuja('bot escribiendo', 'escribiendo…');
  try {
    const r = await fetch('api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: historial.slice(-19) }),
    });
    const datos = await r.json().catch(() => ({}));
    espera.remove();
    if (!r.ok || !datos.reply) throw new Error(datos.error || 'El asistente no está disponible ahora.');
    burbuja('bot', datos.reply);
    historial.push({ role: 'assistant', content: datos.reply });
  } catch (e) {
    espera.remove();
    historial.pop(); // el mensaje sin respuesta no se queda en la conversación
    burbuja('error', e.message);
  } finally {
    enviar.disabled = false;
    texto.focus();
  }
}

form.addEventListener('submit', e => { e.preventDefault(); mandar(texto.value); });
document.querySelectorAll('#atajos button').forEach(b => b.addEventListener('click', () => mandar(b.textContent)));
</script>
</body>
</html>
