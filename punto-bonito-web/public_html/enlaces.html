<style>
  :root{
    --cream:#FDF7F3; --pink:#F7B6D9; --magenta:#E6157E; --purple:#6E1E78;
    --yellow:#FBC21A; --blue:#1E8FD8; --green:#6CC04A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;font-family:Poppins,system-ui,sans-serif;color:var(--purple);
    background:var(--cream);
    background-image:
      radial-gradient(circle at 0 0, rgba(247,182,217,.55) 0 120px, transparent 121px),
      radial-gradient(circle at 100% 100%, rgba(251,194,26,.28) 0 140px, transparent 141px);
    display:flex;justify-content:center;padding:28px 18px 40px;
  }
  main{width:100%;max-width:440px;text-align:center}
  .logo{width:116px;height:auto;display:block;margin:0 auto 10px}
  h1{font-weight:800;font-size:2.3rem;letter-spacing:.5px;line-height:1}
  .tag{
    display:inline-block;margin-top:10px;padding:4px 18px;border-radius:999px;
    background:var(--pink);font-family:'Dancing Script',cursive;font-size:1.35rem;color:var(--purple)
  }
  .city{margin-top:8px;font-size:.85rem;font-weight:500;opacity:.75}
  .poni{width:170px;height:auto;display:block;margin:14px auto -8px;position:relative;z-index:1;
        animation:wave 3s ease-in-out infinite;transform-origin:50% 100%}
  @keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg) translateY(-3px)}}
  @media (prefers-reduced-motion:reduce){.poni{animation:none}}
  .links{display:flex;flex-direction:column;gap:14px;position:relative;z-index:2}
  a.btn{
    display:flex;align-items:center;gap:14px;text-decoration:none;
    padding:14px 18px;border-radius:18px;background:#fff;color:var(--purple);
    border:3px solid var(--purple);box-shadow:0 5px 0 var(--c);
    font-weight:700;font-size:1.05rem;transition:transform .12s, box-shadow .12s;
  }
  a.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--c)}
  a.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--c)}
  a.btn .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--c);flex:none}
  a.btn .ic svg{width:24px;height:24px;fill:#fff}
  a.btn span.t{flex:1;text-align:left}
  a.btn small{display:block;font-weight:500;font-size:.78rem;opacity:.7}
  a.btn .ar{font-size:1.3rem;opacity:.6}
  .web{--c:var(--magenta)} .ig{--c:#C13584} .fb{--c:var(--blue)} .tt{--c:#111}
  footer{margin-top:26px;font-size:.8rem;opacity:.7}
  .heart{color:var(--magenta)}
</style>
</head>
